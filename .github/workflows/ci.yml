name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # The browser-judge tests need a real Chromium (loopback-only traffic; still no external
      # network). Cache the browser download keyed on the pinned Playwright version.
      - id: playwright-version
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: npx playwright install --with-deps chromium

      # The unit suite runs offline (mocked dependencies; browser tests hit loopback only); the
      # e2e suite (npm run test:e2e) drives the live deployment and is not run in CI.
      - run: npm run check
      - run: npm test
